name: EvoCore CI & Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test (${{ matrix.os }}, Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Package & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Cache Upstream Tiny Core Base ISO
        uses: actions/cache@v4
        id: iso-cache
        with:
          path: TinyCore-current.iso
          key: tinycore-17.1-x86-iso-v2

      - name: Download Base Tiny Core ISO if not cached
        if: steps.iso-cache.outputs.cache-hit != 'true'
        run: |
          python -c "import urllib.request, os; req = urllib.request.Request('http://tinycorelinux.net/17.x/x86/release/TinyCore-current.iso', headers={'User-Agent': 'Mozilla/5.0'}); open('TinyCore-current.iso', 'wb').write(urllib.request.urlopen(req, timeout=60).read()); print('Done downloading TinyCore ISO')"

      - name: Run EvoCore Test Suite
        run: |
          pytest tests -v
